version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: livio-postgres
    environment:
      POSTGRES_DB: livio_db
      POSTGRES_USER: livio_user
      POSTGRES_PASSWORD: livio_secure_password_2024
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livio_user"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - livio-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: livio-backend
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/livio_db
      - SPRING_DATASOURCE_USERNAME=livio_user
      - SPRING_DATASOURCE_PASSWORD=livio_secure_password_2024
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
      - SERVER_SERVLET_CONTEXT_PATH=/
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - livio-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/api/pgs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: livio-frontend
    ports:
      - "8082:8082"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8083/api
      - DOCKER_ENVIRONMENT=true
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - livio-network

networks:
  livio-network:
    driver: bridge

volumes:
  postgres_data:
