version: '3.8'

services:
  scraper:
    image: gosom/google-maps-scraper
    container_name: pg-scraper
    volumes:
      - ./queries:/queries:ro
      - ./output:/out
    # Default command - override with: docker compose run scraper mumbai
    # Add proxy with: docker compose run scraper mumbai --proxy 'socks5://user:pass@host:port'
    command:
      - -input /queries/mumbai.txt
      - -results /out/mumbai.csv
      - -depth 1
      - -c 2
      - -browser-pool-size 1
      - -exit-on-inactivity 5m
