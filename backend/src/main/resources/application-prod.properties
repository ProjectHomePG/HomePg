# Server Config
server.port=8083

# PostgreSQL Database Config (Production)
spring.datasource.url=jdbc:postgresql://postgres:5432/livio_db
spring.datasource.username=livio_user
spring.datasource.password=livio_secure_password_2024
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Config
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Connection Pool Config
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# Spring Security / Security config
app.jwt.secret=${JWT_SECRET:PlaceholderSecretKeyMustBeAtLeast256BitsLongForHS256SigningKey}
app.jwt.expiration-ms=86400000

# File Upload Config
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Logging config
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=WARN
logging.level.com.livio=INFO
logging.level.org.hibernate=WARN
