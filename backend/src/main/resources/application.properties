# Server Config
server.port=${PORT:8083}

# Database: the actual DataSource is built by DataSourceConfig (embedded H2 file
# at ./data/livio_db, or an external DB via SPRING_DATASOURCE_URL/DATABASE_URL).
# Do NOT set spring.jpa.database-platform here - the dialect must be auto-detected
# from the real connection. Forcing a dialect that does not match the actual
# database (e.g. SQLite-flavored DDL against H2) breaks identity/auto-increment
# columns, and seeding then fails with 'NULL not allowed for column "ID"'.

# H2 Console Config (Enabled for local dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Config
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Spring Security / Security config placeholders
app.jwt.secret=PlaceholderSecretKeyMustBeAtLeast256BitsLongForHS256SigningKey
app.jwt.expiration-ms=86400000

# File Upload Config
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Logging config
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE