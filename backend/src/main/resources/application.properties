# Server Config
server.port=8083

# Database Config (Local Dev uses H2, Production uses Postgres via Env Vars)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/livio_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# H2 Console Config (Enabled for local dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Config
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Spring Security / Security config placeholders
app.jwt.secret=PlaceholderSecretKeyMustBeAtLeast256BitsLongForHS256SigningKey
app.jwt.expiration-ms=86400000

# File Upload Config
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Logging config
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE